"$schema" = "https://starship.rs/config-schema.json"

# Left: where you are and git state. Right: toolchain, cluster, last command time.
#   dotfiles/rex  main ✚1 ?2                          3.12 󱃾 prod (api) 4s
#   ➜
format = """
$directory\
$git_branch\
$git_state\
$git_status\
$line_break\
$character"""
right_format = """
$python\
$nodejs\
$golang\
$helm\
$kubernetes\
$cmd_duration"""

add_newline = true
command_timeout = 500 # a module slower than this is skipped, not waited on
palette = "ayu"       # matches the Rex/Ghostty Ayu theme (rex/themes/Ayu)

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 󰌾"
truncate_to_repo = true # inside a repo the path starts at the repo name
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "purple"

[git_state]
style = "bold orange"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "orange"
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
modified = "✚${count} "
staged = "●${count} "
untracked = "?${count} "
deleted = "✖${count} "
renamed = "»${count} "
conflicted = "=${count} "
stashed = "≡ "

[python]
format = "[$symbol$version( \\($virtualenv\\))]($style) "
python_binary = "python3"
version_format = "${major}.${minor}"
symbol = " "
style = "yellow"

[nodejs]
format = "[$symbol$version]($style) "
symbol = " "
style = "green"
version_format = "${major}"

[golang]
format = "[$symbol$version]($style) "
symbol = " "
style = "cyan"
version_format = "${major}.${minor}"

[helm]
format = "[$symbol$version]($style) "
symbol = "⎈ "
style = "blue"

[kubernetes]
disabled = false
# Only in folders that deploy to a cluster, not on every prompt.
detect_files = ["Chart.yaml", "helmfile.yaml", "kustomization.yaml", "skaffold.yaml", "Tiltfile"]
detect_folders = ["charts", "helm", "k8s", "kustomize"]
format = "[$symbol$context( \\($namespace\\))]($style) "
symbol = "󱃾 "
style = "cyan"

[cmd_duration]
format = "[$duration]($style)"
min_time = 2000
style = "gray"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[](bold green)"

[palettes.ayu]
black = "#11151c"
red = "#f07178"
green = "#aad94c"
yellow = "#ffb454"
blue = "#59c2ff"
purple = "#d2a6ff"
cyan = "#95e6cb"
orange = "#e6b450"
white = "#bfbdb6"
gray = "#686868"
